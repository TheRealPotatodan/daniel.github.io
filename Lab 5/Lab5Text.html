<body>
	<h1>Volunteer Form</h1>
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php">
      <label for="first_name_field">First name:</label><br>
      <input type="text" id="first_name_field" name="first_name_field" value=""><br><br>
      <label for="last_name_field">Last name:</label><br>
      <input type="text" id="last_name_field" name="last_name_field" value=""><br><br>
      <label for="phone">Phone:</label><br>
      <input type="text" id="phone" name="phone" value=""><br><br>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" value=""><br><br>
      <label for="gender">Gender:</label><br>
      <input type="text" id="gender" name="gender" value=""><br><br>
      <label for="age">Age:</label><br>
      <input type="number" id="age" name="age" value=""><br><br>
      <label for="available_field[]">Available:</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="sunday">
      <label for="available_field[]"> sunday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="monday">
      <label for="available_field[]"> monday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="tuesday">
      <label for="available_field[]"> tuesday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="wednesday">
      <label for="available_field[]"> wednesday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="thursday">
      <label for="available_field[]"> thursday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="friday">
      <label for="available_field[]"> friday</label><br>
      <input type="checkbox" id="available_field[]" name="available_field[]" value="saturday">
      <label for="available_field[]"> saturday</label><br><br>
      <label for="comments">Comments:</label><br>
      <textarea id="comments" name="comments"></textarea><br><br>
      <label for="hidden_field"></label>
      <input type="hidden" id="hidden_field" name="hidden_field" value="">
      <input type="submit" value="Submit">
    </form>
